[workspace]
resolver = "2"
members = [
    "boson-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }
leptos-use = { version = "0.18", default-features = false }

axum = { version = "0.8.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
turf = "0.10"

boson = { package = "uf-boson", version = "0.1.1", default-features = false }
boson-core = { version = "0.1.1", default-features = false }
boson-runtime = { version = "0.1.1", default-features = false }
boson-coordinator = { git = "https://github.com/deathbreakfast/boson-coordinator", branch = "feat/crates-io-uf-deps" }
higgs = { path = "../fleet/repos/valence-platform/higgs-platform", default-features = false }
valence = { package = "uf-valence", version = "0.1.1", default-features = false, features = ["mem", "sqlite"] }
uf-host = { git = "https://github.com/deathbreakfast/valence-platform", branch = "feat/crates-io-uf-deps", default-features = false }
uf-identity = { git = "https://github.com/deathbreakfast/valence-platform", branch = "feat/crates-io-uf-deps" }

orbital = { package = "orbital-ui", git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }
orbital-charts = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }
orbital-data = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish" }
orbital-macros = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish" }
orbital-motion = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish" }
orbital-paging = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }

uf-integrations = { path = "../unified-field-product/uf-integrations", default-features = false }
uf-product = { path = "../unified-field-product/uf-product", default-features = false }
uf-product-macros = { path = "../unified-field-product/uf-product-macros" }
uf-ssr = { path = "../counter-app/uf-ssr", default-features = false }
uf-app-registry = { path = "../counter-app/uf-app-registry" }
inventory = "0.3"
wasm-bindgen = "=0.2.126"
lepton-shell = { git = "https://github.com/deathbreakfast/lepton-auth", branch = "feat/crates-io-uf-deps", package = "lepton-shell", default-features = false }

