[workspace]
resolver = "2"
members = [
    "boson-app",
    "uf-integrations",
    "uf-product-macros",
    "uf-ssr",
    "uf-app-registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_integration_utils = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }
leptos-use = { version = "0.18", default-features = false }

axum = { version = "0.8.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
turf = "0.10"

boson = { git = "https://github.com/deathbreakfast/boson.git", rev = "2769b6f93d9da47b1d7855aefd5aa29f33e958d4", default-features = false }
boson-core = { git = "https://github.com/deathbreakfast/boson.git", rev = "2769b6f93d9da47b1d7855aefd5aa29f33e958d4", default-features = false }
boson-runtime = { git = "https://github.com/deathbreakfast/boson.git", rev = "2769b6f93d9da47b1d7855aefd5aa29f33e958d4", default-features = false }
boson-coordinator = { git = "https://github.com/deathbreakfast/boson-coordinator", rev = "deb8060ef87ffb507b40f7ea6597eeef76e204a0" }
higgs = { git = "https://github.com/deathbreakfast/valence-platform", rev = "8e8a4e7", package = "higgs", default-features = false }
valence = { git = "https://github.com/deathbreakfast/valence-platform", rev = "8e8a4e7", package = "valence", default-features = false }

orbital = { git = "https://github.com/deathbreakfast/orbital", rev = "2815678421984f854e2690c6e13d45bc6512ae38", default-features = false }
orbital-charts = { git = "https://github.com/deathbreakfast/orbital", rev = "2815678421984f854e2690c6e13d45bc6512ae38", default-features = false }
orbital-data = { git = "https://github.com/deathbreakfast/orbital", rev = "2815678421984f854e2690c6e13d45bc6512ae38" }
orbital-macros = { git = "https://github.com/deathbreakfast/orbital", rev = "2815678421984f854e2690c6e13d45bc6512ae38" }
orbital-motion = { git = "https://github.com/deathbreakfast/orbital", rev = "2815678421984f854e2690c6e13d45bc6512ae38" }
orbital-paging = { git = "https://github.com/deathbreakfast/orbital", rev = "2815678421984f854e2690c6e13d45bc6512ae38", default-features = false }

uf-integrations = { path = "uf-integrations", default-features = false }
uf-product-macros = { path = "uf-product-macros" }
uf-ssr = { path = "uf-ssr", default-features = false }
uf-app-registry = { path = "uf-app-registry" }
inventory = "0.3"
